[project]
name = "agent-governance-kit"
version = "0.1.0"
description = "5-line OWASP Top 10 Agentic AI + EU AI Act compliance middleware for any LLM agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Shubham Dusane", email = "sdusane4@gmail.com" }
]
keywords = ["ai", "agents", "owasp", "eu-ai-act", "llm", "compliance", "governance", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio", "pytest-cov", "ruff", "mypy"]
langchain = ["langchain>=0.1"]
prometheus = ["prometheus-client>=0.17"]

[project.urls]
Homepage = "https://github.com/shubhamdusane/agent-governance-kit"
Repository = "https://github.com/shubhamdusane/agent-governance-kit"
Issues = "https://github.com/shubhamdusane/agent-governance-kit/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_governance_kit*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
